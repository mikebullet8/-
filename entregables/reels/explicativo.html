<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
:root{--y:#ffd400;--red:#ff4d5e;--green:#3ee6a0;--blue:#6fb6ff;--ink:#07070c;--fg:#fff;--muted:rgba(255,255,255,.55);
 --display:"Inter Display","Inter","Noto Color Emoji",sans-serif;--mono:"JetBrains Mono",monospace}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);color:var(--fg);font-family:var(--display)}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(60,70,110,.35),transparent 60%),radial-gradient(ellipse at 50% 120%,rgba(255,180,0,.12),transparent 50%)}
#dust{position:absolute;inset:0}
#chap{position:absolute;top:150px;left:0;right:0;text-align:center;font:600 30px var(--mono);letter-spacing:3px;color:var(--muted);text-transform:uppercase}
#chap:before{content:"● ";color:var(--red)}
#title{position:absolute;top:200px;left:60px;right:60px;text-align:center;font:900 78px/1.05 var(--display);letter-spacing:-1px;text-transform:uppercase;text-wrap:balance;transition:opacity .25s,transform .35s;text-shadow:0 0 40px currentColor}
#title.out{opacity:0;transform:translateY(-20px)}
#sub{position:absolute;top:300px;left:60px;right:60px;text-align:center;font:600 40px var(--display);color:rgba(255,255,255,.8)}
svg#scene{position:absolute;left:0;top:380px;width:1080px;height:1000px;overflow:visible}
.bone{fill:none;stroke:rgba(225,235,255,.75);stroke-width:26;stroke-linecap:round;filter:url(#glow)}
.joint{fill:rgba(235,240,255,.9);filter:url(#glow)}
.soft{fill:rgba(200,215,255,.10);stroke:rgba(220,230,255,.35);stroke-width:4}
#armL,#armR{transform-origin:center;transform-box:fill-box}
.typing #armL{animation:tL .22s ease-in-out infinite alternate}.typing #armR{animation:tR .25s ease-in-out infinite alternate}
@keyframes tL{to{transform:translateY(10px)}}@keyframes tR{to{transform:translateY(-10px)}}
#screenTxt{position:absolute;left:300px;top:870px;width:480px;height:250px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 28px}
.sb{align-self:flex-end;max-width:100%;background:var(--y);color:var(--ink);font:700 28px/1.25 var(--display);padding:12px 18px;border-radius:18px 18px 4px 18px;opacity:0;transform:scale(.8);transition:all .3s cubic-bezier(.2,1.5,.4,1)}
.sb.ia{align-self:flex-start;background:rgba(255,255,255,.16);color:#fff;border-radius:18px 18px 18px 4px}
.sb.show{opacity:1;transform:none}
.lab{position:absolute;font:700 30px var(--mono);letter-spacing:1px;padding:10px 20px;border-radius:12px;background:rgba(10,10,18,.85);border:2px solid currentColor;text-transform:uppercase;opacity:0;transform:scale(.8);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);white-space:nowrap;box-shadow:0 0 30px -6px currentColor}
.lab.show{opacity:1;transform:none}
svg#lines{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}
svg#lines line{stroke-width:3;stroke-dasharray:400;stroke-dashoffset:400;transition:stroke-dashoffset .5s}
svg#lines line.show{stroke-dashoffset:0}
svg#lines circle{transition:opacity .3s}
#meter{position:absolute;left:180px;right:180px;top:1330px;display:flex;align-items:center;gap:20px;padding:16px 24px;border-radius:16px;border:2px solid var(--mc,var(--red));background:rgba(10,10,18,.8);font:700 28px var(--mono);opacity:0;transition:opacity .3s,border-color .4s;box-shadow:0 0 30px -8px var(--mc,var(--red))}
#meter.show{opacity:1}
#meter .tr{flex:1;height:18px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
#meter .fi{height:100%;width:0;border-radius:9px;background:var(--mc,var(--red));transition:width .9s cubic-bezier(.3,.8,.3,1),background .4s}
#pills{position:absolute;top:420px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:18px}
#cap{position:absolute;left:70px;right:70px;top:1450px;display:flex;justify-content:center}
#cap span.box{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:0 18px;max-width:100%;padding:14px 28px;border-radius:14px;background:rgba(0,0,0,.55);font:900 64px/1.15 var(--display);text-transform:uppercase;letter-spacing:.5px}
#cap .cw{color:#fff;opacity:.95}#cap .cw.now{color:var(--y)}
#cta{position:absolute;left:0;right:0;top:1330px;display:flex;justify-content:center;opacity:0;transition:opacity .4s}
#cta.show{opacity:1}
#cta div{background:var(--y);color:var(--ink);font:900 50px var(--display);padding:24px 48px;border-radius:999px;box-shadow:0 0 60px rgba(255,212,0,.5);animation:pu 1s ease-in-out infinite}
@keyframes pu{50%{transform:scale(1.06)}}
#brand{position:absolute;bottom:150px;left:0;right:0;text-align:center;font:600 32px var(--display);color:var(--muted)}
</style></head><body>
<div id="vignette"></div><canvas id="dust" width="1080" height="1920"></canvas>
<div id="chap"></div><div id="title"></div><div id="sub"></div>
<svg id="scene" viewBox="0 0 1080 1000">
 <defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="big" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="30"/></filter>
  <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a2a22"/><stop offset="1" stop-color="#120c0a"/></linearGradient>
 </defs>
 <!-- cuerpo -->
 <g id="body">
  <circle class="soft" cx="540" cy="150" r="105"/>
  <circle id="brain" cx="540" cy="140" r="55" fill="var(--red)" opacity=".55" filter="url(#big)"/>
  <circle cx="515" cy="135" r="38" fill="none" stroke="rgba(230,235,255,.7)" stroke-width="5" filter="url(#glow)"/>
  <circle cx="565" cy="135" r="38" fill="none" stroke="rgba(230,235,255,.7)" stroke-width="5" filter="url(#glow)"/>
  <path class="soft" d="M380 330 Q540 260 700 330 L720 620 Q540 660 360 620 Z"/>
  <g id="spine"></g>
  <path class="bone" d="M400 320 L680 320"/>
  <g id="armL"><path class="bone" d="M400 320 L330 500 L420 610"/><circle class="joint" cx="330" cy="500" r="16"/></g>
  <g id="armR"><path class="bone" d="M680 320 L750 500 L660 610"/><circle class="joint" cx="750" cy="500" r="16"/></g>
 </g>
 <!-- escritorio y portátil -->
 <rect x="150" y="700" width="780" height="300" rx="30" fill="url(#desk)"/>
 <rect x="150" y="700" width="780" height="10" rx="5" fill="rgba(120,180,255,.55)" filter="url(#glow)"/>
 <ellipse cx="540" cy="705" rx="330" ry="40" fill="rgba(110,170,255,.25)" filter="url(#big)"/>
 <rect id="screen" x="290" y="470" width="500" height="270" rx="18" fill="rgba(20,30,55,.92)" stroke="rgba(140,190,255,.9)" stroke-width="5" filter="url(#glow)"/>
 <rect x="250" y="735" width="580" height="22" rx="10" fill="rgba(160,190,240,.6)" filter="url(#glow)"/>
</svg>
<div id="screenTxt"></div>
<svg id="lines"></svg>
<div id="labs"></div>
<div id="pills"></div>
<div id="meter"><span id="ml">CALIDAD</span><div class="tr"><div class="fi"></div></div><span id="mv">0%</span></div>
<div id="cta"><div>👆 Link en el perfil</div></div>
<div id="cap"></div>
<div id="brand">@atajo.ialatam</div>
<script>
const D=JSON.parse(decodeURIComponent(location.hash.slice(1)));const S=D.scenes;
// polvo flotante
const cv=document.getElementById('dust'),cx=cv.getContext('2d');const P=[...Array(70)].map(()=>({x:Math.random()*1080,y:Math.random()*1920,r:Math.random()*2.5+.5,v:Math.random()*.4+.1}));
(function dust(){cx.clearRect(0,0,1080,1920);P.forEach(p=>{p.y-=p.v;if(p.y<0)p.y=1920;cx.fillStyle='rgba(255,255,255,.25)';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()});requestAnimationFrame(dust)})();
// columna
const sp=document.getElementById('spine');for(let i=0;i<9;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',540);c.setAttribute('cy',345+i*32);c.setAttribute('r',11);c.setAttribute('class','joint');sp.appendChild(c)}
const COL={red:'var(--red)',y:'var(--y)',green:'var(--green)',blue:'var(--blue)',white:'#fff'};
const $=id=>document.getElementById(id);
function scene(s){
  $('chap').textContent=s.chap||'';$('chap').style.visibility=s.chap?'visible':'hidden';
  const T=$('title');T.classList.add('out');setTimeout(()=>{T.textContent=s.title||'';T.style.color=COL[s.color||'white'];T.classList.remove('out')},200);
  $('sub').textContent=s.sub||'';
  document.body.classList.toggle('typing',!!s.typing);
  $('brain').setAttribute('fill',COL[s.brain||'red']);
  // pantalla
  const st=$('screenTxt');st.innerHTML='';(s.screen||[]).forEach((m,i)=>{const b=document.createElement('div');b.className='sb'+(m[0]=='ia'?' ia':'');b.textContent=m[1];st.appendChild(b);setTimeout(()=>b.classList.add('show'),300+i*700)});
  // etiquetas
  const L=$('labs'),SV=$('lines');L.innerHTML='';SV.innerHTML='';
  (s.labels||[]).forEach((l,i)=>{const c=COL[l.c||'y'];const el=document.createElement('div');el.className='lab';el.style.color=c;el.textContent=l.t;el.style.left=l.x+'px';el.style.top=l.y+'px';L.appendChild(el);
    if(l.px){const ln=document.createElementNS('http://www.w3.org/2000/svg','line');ln.setAttribute('x1',l.x+(l.ax||40));ln.setAttribute('y1',l.y+50);ln.setAttribute('x2',l.px);ln.setAttribute('y2',l.py);ln.setAttribute('stroke',getComputedStyle(document.documentElement).getPropertyValue('--'+({red:'red',y:'y',green:'green',blue:'blue'}[l.c||'y'])));SV.appendChild(ln);
      const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('cx',l.px);dot.setAttribute('cy',l.py);dot.setAttribute('r',9);dot.setAttribute('fill',ln.getAttribute('stroke'));dot.style.opacity=0;SV.appendChild(dot);
      setTimeout(()=>{ln.classList.add('show');dot.style.opacity=1},(l.at||0.4+i*0.5)*1000)}
    setTimeout(()=>el.classList.add('show'),(l.at||0.4+i*0.5)*1000)});
  // pastillas apiladas
  const PL=$('pills');PL.innerHTML='';(s.pills||[]).forEach((p,i)=>{const el=document.createElement('div');el.className='lab';el.style.position='static';el.style.color=COL[p.c||'red'];el.textContent=p.t;PL.appendChild(el);setTimeout(()=>el.classList.add('show'),(p.at||0.5+i*0.6)*1000)});
  // medidor
  const M=$('meter');if(s.meter){M.classList.add('show');const col=s.meter.v<40?'var(--red)':s.meter.v<80?'var(--y)':'var(--green)';M.style.setProperty('--mc',col);$('ml').textContent=s.meter.l||'CALIDAD';
    setTimeout(()=>{M.querySelector('.fi').style.width=s.meter.v+'%';let v0=parseInt($('mv').textContent)||0;const v1=s.meter.v,t0=performance.now();(function c(){const k=Math.min(1,(performance.now()-t0)/900);$('mv').textContent=Math.round(v0+(v1-v0)*k)+'%';if(k<1)requestAnimationFrame(c)})()},300)}else M.classList.remove('show');
  $('cta').classList.toggle('show',!!s.cta);
  // subtítulos karaoke
  const words=s.say.split(/\s+/).filter(Boolean);const tot=words.reduce((a,w)=>a+w.length+2,0);let acc=0;const tm=words.map(w=>{const t=acc/tot*(s.d-0.15);acc+=w.length+2;return t});
  const cap=$('cap');const CH=3;
  words.forEach((w,i)=>setTimeout(()=>{const g=Math.floor(i/CH)*CH;cap.innerHTML='<span class="box">'+words.slice(g,g+CH).map((x,j)=>`<span class="cw${g+j==i?' now':''}">${x}</span>`).join('')+'</span>'},tm[i]*1000));
}
let t=0;S.forEach(s=>{setTimeout(()=>scene(s),t*1000);t+=s.d});
</script></body></html>
