<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0f0e0b;font-family:'DejaVu Sans',sans-serif;color:#f3f1ea}
#bg{position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,#2a2508 0,#0f0e0b 55%)}
#bar{position:absolute;top:0;left:0;height:14px;background:#ffd400;width:0}
#brand{position:absolute;top:120px;left:90px;font:700 40px 'DejaVu Sans';color:#ffd400;letter-spacing:4px}
.scene{position:absolute;left:90px;right:150px;top:560px;opacity:0;transform:translateY(60px);transition:opacity .35s,transform .45s cubic-bezier(.2,1.4,.4,1)}
.scene.on{opacity:1;transform:none}
.tag{display:inline-block;background:#ffd400;color:#141208;font:800 40px 'DejaVu Sans';padding:8px 22px;border-radius:10px;margin-bottom:34px}
.t{font:800 92px/1.12 'DejaVu Sans'}
.t.m{font-size:74px}
.hl{background:linear-gradient(#ffd400,#ffd400) no-repeat 0 85%/0% 38%;transition:background-size .6s .4s}
.on .hl{background-size:100% 38%}
.chat{margin-top:46px;background:#1e1d17;border:4px solid #ffd400;border-radius:28px;padding:34px 36px;font:500 44px/1.45 'DejaVu Sans Mono';min-height:200px}
.chat .cur{display:inline-block;width:22px;height:46px;background:#ffd400;vertical-align:-8px;animation:b 0.7s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.arrow{font-size:150px;color:#ffd400;margin-top:40px;animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(30px)}}
.big{font:900 260px/1 'DejaVu Sans';color:#ffd400}
.dm{margin-top:40px;display:flex;flex-direction:column;gap:22px}
.b{max-width:85%;padding:24px 30px;border-radius:34px;font:500 44px/1.35 'DejaVu Sans';opacity:0;transform:scale(.85);transition:opacity .25s,transform .3s cubic-bezier(.2,1.5,.4,1)}
.b.show{opacity:1;transform:none}
.b.yo{align-self:flex-end;background:#ffd400;color:#141208;border-bottom-right-radius:8px}
.b.ia{align-self:flex-start;background:#2a2922;color:#f3f1ea;border-bottom-left-radius:8px}
.who{font:700 30px 'DejaVu Sans';opacity:.6;display:block;margin-bottom:6px}
</style></head><body><div id="bg"></div><div id="bar"></div><div id="brand">⚡ ATAJO IA</div><div id="stage"></div>
<script>
const S=JSON.parse(decodeURIComponent(location.hash.slice(1)));
const total=S.reduce((a,s)=>a+s.d,0);
const st=document.getElementById('stage');
const hl=t=>t.replace(/\*(.+?)\*/g,'<span class="hl">$1</span>');
let t0=0;
S.forEach((s,i)=>{
  const el=document.createElement('div');el.className='scene';
  el.innerHTML=(s.tag?`<div class="tag">${s.tag}</div>`:'')+(s.big?`<div class="big">${s.big}</div>`:'')+`<div class="t ${s.chat?'m':''}">${hl(s.t)}</div>`+(s.chat?`<div class="chat"><span class="ty"></span><span class="cur"></span></div>`:'')+(s.arrow?'<div class="arrow">↓</div>':'')+(s.dm?'<div class="dm">'+s.dm.map(m=>`<div class="b ${m[0]}"><span class="who">${m[0]=='yo'?'Tú':'IA'}</span>${hl(m[1])}</div>`).join('')+'</div>':'');
  st.appendChild(el);
  setTimeout(()=>{document.querySelectorAll('.scene').forEach(x=>x.classList.remove('on'));el.classList.add('on');
    if(s.dm){const bs=el.querySelectorAll('.b');const gap=(s.d*1000-500)/bs.length;bs.forEach((b,j)=>setTimeout(()=>b.classList.add('show'),300+j*gap))}
    if(s.chat){const ty=el.querySelector('.ty');let k=0;const sp=Math.max(12,Math.min(40,(s.d*1000-900)/s.chat.length));
      const iv=setInterval(()=>{ty.textContent=s.chat.slice(0,++k);if(k>=s.chat.length)clearInterval(iv)},sp)}
  },t0*1000);
  t0+=s.d;
});
const bar=document.getElementById('bar');const start=performance.now();
(function f(){const p=Math.min(1,(performance.now()-start)/(total*1000));bar.style.width=(p*100)+'%';if(p<1)requestAnimationFrame(f)})();
</script></body></html>
